# Local pre-commit gate. Mirrors the `pre-commit` CI job exactly, so a clean
# run here is a clean run there.
#
# Setup (once per clone):
#   make hooks
#
# Tool versions below must stay in sync with the `dev` extra in setup.cfg.
# Bump them together, in their own PR.

# The vendored OpenAI SDK is generated by python-vendorize and must never be
# reformatted -- see CLAUDE.md. Excluding it here also keeps pre-commit from
# handing those paths to ruff in the first place.
exclude: ^portkey_ai/_vendor/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # This is the hook that would have caught PR #439.
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files

  # ruff is both the linter and the formatter -- black is deliberately absent.
  # Do not add black back alongside `ruff-format`: they disagree on ~20 files
  # and would revert each other on every run, so the hook would never converge.
  # Order matters: lint fixes first, then format the result.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # mypy runs as a `system` hook rather than via mirrors-mypy: it needs the
      # project's own environment to resolve the vendored openai package and
      # pydantic/httpx types, which an isolated hook env would not have.
      # Requires `make dev` in the active virtualenv.
      - id: mypy
        name: mypy
        entry: mypy
        language: system
        types: [python]
        # Whole-project run -- mypy's `files` setting in pyproject.toml decides
        # the scope, and per-file invocation gives wrong results anyway.
        pass_filenames: false
        require_serial: true
